<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞士輪與雙淘汰賽程管理系統 (單場總決賽版)</title>
    <style>
        /* 全局與暗色主題設定 */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --accent-color: #00d2ff; /* 淺藍色字體與線條顏色 */
            --btn-hover: #3a86ff;
            --disabled: #555555;
            --danger: #ff4b4b;
            --success: #00ff87;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-y: auto;
        }
        h1, h2, h3 { text-align: center; color: var(--accent-color); margin-bottom: 10px; }
        
        .round-indicator {
            text-align: center; color: #aaaaaa; font-size: 1rem;
            letter-spacing: 2px; margin-bottom: 5px; font-weight: bold;
        }

        /* ================= 左側可彈出/收起 歷史紀錄側邊欄 ================= */
        .history-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            height: 100vh;
            background: #181818;
            border-right: 2px solid #333;
            box-shadow: 6px 0 24px rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }
        .history-sidebar.collapsed {
            transform: translateX(-320px);
        }
        .sidebar-toggle-btn {
            position: absolute;
            top: 20px;
            right: -46px;
            width: 46px;
            height: 110px;
            background: #1e1e1e;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            border-left: none;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 4px;
            margin: 0;
            font-size: 0.9rem;
            font-weight: bold;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 2px;
            box-shadow: 4px 2px 12px rgba(0, 0, 0, 0.5);
            transition: background 0.2s, color 0.2s;
        }
        .sidebar-toggle-btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: #000;
            transform: none;
        }
        .sidebar-header {
            padding: 18px 16px 14px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
        }
        .sidebar-header h3 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--accent-color);
            text-align: left;
        }
        .sidebar-collapse-inner-btn {
            background: transparent;
            color: #aaa;
            border: 1px solid #444;
            padding: 4px 10px;
            margin: 0;
            font-size: 0.85rem;
            border-radius: 4px;
        }
        .sidebar-collapse-inner-btn:hover:not(:disabled) {
            background: #333;
            color: #fff;
            transform: none;
        }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-empty {
            color: #777;
            text-align: center;
            margin-top: 40px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .history-item {
            background: #242424;
            border: 1px solid #3a3a3a;
            border-left: 4px solid var(--accent-color);
            border-radius: 8px;
            padding: 12px;
            transition: border-color 0.2s, background 0.2s;
        }
        .history-item.current-active {
            border-color: var(--success);
            border-left-color: var(--success);
            background: #1f2a24;
        }
        .history-item-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: #fff;
            margin-bottom: 6px;
            word-break: break-all;
            cursor: pointer;
        }
        .history-item-title:hover {
            color: var(--accent-color);
        }
        .history-item-meta {
            font-size: 0.83rem;
            color: #bbb;
            margin-bottom: 4px;
        }
        .history-item-time {
            font-size: 0.75rem;
            color: #777;
            margin-bottom: 10px;
        }
        .history-item-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .history-btn {
            flex: 1;
            padding: 6px 8px;
            margin: 0;
            font-size: 0.82rem;
            border-radius: 5px;
            text-align: center;
            white-space: nowrap;
        }
        .history-btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }
        .history-btn.resume-btn {
            background: var(--accent-color);
            color: #000;
        }
        .history-btn.rename-btn {
            background: #3a3a3a;
            color: #fff;
            border: 1px solid #555;
        }
        .history-btn.rename-btn:hover:not(:disabled) {
            background: #505050;
        }
        .history-btn.delete-btn {
            background: rgba(255, 75, 75, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
        }
        .history-btn.delete-btn:hover:not(:disabled) {
            background: var(--danger);
            color: #fff;
        }
        .rename-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }
        .rename-box input[type="text"] {
            margin: 0;
            padding: 6px 8px;
            font-size: 0.95rem;
            background: #141414;
            border: 1px solid var(--accent-color);
        }
        .rename-box-btns {
            display: flex;
            gap: 6px;
        }
        .top-nav-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
        }
        .btn-back-home {
            background: #2c2c2c;
            color: #ddd;
            border: 1px solid #555;
            padding: 6px 14px;
            margin: 0;
            font-size: 0.9rem;
            border-radius: 6px;
        }
        .btn-back-home:hover:not(:disabled) {
            background: #444;
            color: #fff;
            transform: none;
        }

        /* 畫面切換與容器 */
        .screen {
            display: none; opacity: 0;
            width: 95%; max-width: 1000px;
            margin: 2rem auto; padding: 2rem;
            background: var(--card-bg); border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: opacity 0.4s ease-in-out;
            box-sizing: border-box;
        }
        .screen.active {
            display: block; opacity: 1;
            animation: fadeIn 0.4s forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 輸入框與按鈕 */
        input[type="number"], input[type="text"], select {
            width: 100%; padding: 10px; margin: 10px 0;
            background: #2a2a2a; color: white;
            border: 1px solid #444; border-radius: 6px; font-size: 1.1rem; box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent-color); }
        
        button {
            background: var(--accent-color); color: #000;
            border: none; padding: 12px 24px; margin: 10px 5px;
            font-size: 1.1rem; font-weight: bold; border-radius: 6px;
            cursor: pointer; transition: all 0.3s;
        }
        button:hover:not(:disabled) { background: var(--btn-hover); color: white; transform: scale(1.05); }
        button:disabled { background: var(--disabled); color: #888; cursor: not-allowed; }
        
        /* 瑞士輪賽程表 UI */
        .match-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #2a2a2a; padding: 10px 15px; margin-bottom: 10px;
            border-radius: 8px; border-left: 4px solid var(--accent-color);
        }
        .player-box { display: flex; align-items: center; gap: 10px; flex: 1; }
        .player-box.right { justify-content: flex-end; }
        .vs { font-weight: bold; color: #888; margin: 0 15px; }
        .result-select { width: 80px; padding: 5px; margin: 0; }

        /* 計時器 UI */
        .timer-container {
            text-align: center; background: #000; padding: 20px;
            border-radius: 12px; margin-bottom: 20px; border: 2px solid #333;
        }
        .timer-display {
            font-size: 6.5rem; line-height: 1;
            font-weight: bold; font-family: monospace;
            color: white; margin-bottom: 15px; transition: color 0.3s;
        }
        .timer-display.flash { color: var(--danger); animation: flashRed 1s infinite; }
        @keyframes flashRed { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .timer-controls button { font-size: 0.9rem; padding: 8px 16px; margin: 0 5px; }
        
        /* ================= 雙淘汰 直式樹狀圖 UI (由下而上) ================= */
        .de-bracket-container {
            display: flex; flex-direction: column; gap: 40px; margin-top: 20px;
        }
        .bracket-section {
            background: #151515; padding: 25px 15px; border-radius: 12px;
            border: 1px solid #333; overflow-x: auto;
        }
        .bracket-section h3 { font-size: 1.4rem; border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 0; }

        .vertical-tree {
            display: flex; flex-direction: column; align-items: center;
            padding: 10px 0;
        }
        .tree-row { display: flex; justify-content: center; gap: 40px; }
        
        /* 比賽卡片 */
        .ko-card { 
            background: #222; border: 2px solid #444; border-radius: 8px; 
            width: 220px; padding: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            z-index: 2; transition: all 0.3s ease; position: relative;
        }
        .ko-card.dummy {
            background: transparent; border: 2px dashed #555; display: flex; 
            align-items: center; justify-content: center; color: #777; font-weight: bold;
        }
        /* 當前正在進行的比賽發光變色 */
        .ko-card.active-match { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 15px rgba(0,210,255,0.4); 
        }
        .match-title { font-size: 0.85rem; color: #aaa; margin-bottom: 8px; font-weight: bold; text-align: center; }
        
        .ko-row-player { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 8px 0; border-bottom: 1px solid #3c3c3c; 
        }
        .ko-row-player:last-child { border-bottom: none; }
        .ko-player-info {
            display: flex; align-items: center; flex-wrap: wrap;
            gap: 5px; flex: 1; min-width: 0; margin-right: 6px;
        }
        .ko-name { 
            font-weight: 500; font-size: 1.05rem; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis; max-width: 130px; 
        }
        .ko-row-player.loser .ko-name { color: #666; text-decoration: line-through; }
        .ko-row-player.loser .deck-badge { opacity: 0.45; }
        .deck-badge {
            display: inline-block;
            background-color: #3d3d3d;
            color: #cccccc;
            font-size: 0.8em;
            font-weight: normal;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
            line-height: 1.3;
            white-space: nowrap;
        }
        .ko-player-info .deck-badge {
            margin-left: 0;
            font-size: 0.76rem;
            padding: 1px 6px;
        }
        .ko-select { 
            width: 65px; padding: 4px; font-size: 0.9rem; 
            background: #111; color: white; border: 1px solid #555; 
            border-radius: 4px; margin: 0;
        }
        .ko-select.ko-bo3-select {
            width: 82px;
        }
        .gf-mode-switcher {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .gf-mode-label {
            font-size: 0.9rem;
            color: #ccc;
            font-weight: bold;
        }
        .gf-mode-btn {
            background: #252525;
            color: #aaa;
            border: 1px solid #555;
            padding: 6px 14px;
            margin: 0;
            font-size: 0.88rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .gf-mode-btn:hover:not(:disabled) {
            background: #383838;
            color: #fff;
            transform: none;
        }
        .gf-mode-btn.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.35);
        }

        /* 樹狀圖粗連線 (8px 超醒目淺藍色) */
        .fork-stem {
            width: 8px; /* 醒目的粗度 */
            height: 40px; /* 線條長度 */
            background-color: var(--accent-color); 
        }
        .fork-branches {
            display: flex;
            /* 寬度 = 卡片寬(220) + 間距(40) + 邊框粗細(8) = 268px */
            width: 268px; height: 40px;
            border-top: 8px solid var(--accent-color);
            border-left: 8px solid var(--accent-color);
            border-right: 8px solid var(--accent-color);
            box-sizing: border-box; border-radius: 8px 8px 0 0;
        }
        
        /* 最終排行榜 (冠亞季軍) */
        .rankings-box {
            text-align: center; padding: 30px; background: #111;
            border: 2px solid var(--success); border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 135, 0.2);
            animation: fadeIn 1s forwards; width: 100%; box-sizing: border-box;
            margin-top: 20px;
        }
        .rank-item { font-size: 1.6rem; font-weight: bold; margin: 15px 0; }
        .rank-1 { color: var(--gold); font-size: 2.2rem; }
        .rank-2 { color: var(--silver); }
        .rank-3 { color: var(--bronze); }
        /* ================================================= */
    </style>
</head>
<body>

    <!-- 左側可彈出、收起的歷史紀錄欄位 -->
    <aside id="history-sidebar" class="history-sidebar">
        <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" onclick="toggleHistorySidebar()" title="展開/收起歷史紀錄">
            歷史紀錄
        </button>
        <div class="sidebar-header">
            <h3>📋 賽事歷史紀錄</h3>
            <button class="sidebar-collapse-inner-btn" onclick="toggleHistorySidebar()">◀ 收起</button>
        </div>
        <div id="history-list" class="sidebar-list"></div>
    </aside>

    <div id="screen-1" class="screen active">
        <h1>賽程管理系統</h1>
        <h2>請輸入參賽總人數</h2>
        <input type="number" id="player-count" min="2" placeholder="例如: 8" onkeypress="handleEnter(event, 'btn-screen-1')">
        <div style="text-align: center;">
            <button id="btn-screen-1" onclick="generateNameInputs()">確認 (Enter)</button>
        </div>
    </div>

    <div id="screen-2" class="screen">
        <div class="top-nav-bar">
            <button class="btn-back-home" onclick="returnToHome()">🏠 返回首頁</button>
        </div>
        <h2>請輸入參賽者名單</h2>
        <div id="name-inputs-container"></div>
        <div style="text-align: center; margin-top: 20px;">
            <button id="btn-screen-2" onclick="startSwissTournament()">確認名單 (Enter)</button>
        </div>
    </div>

    <div id="screen-3" class="screen">
        <div class="top-nav-bar">
            <button class="btn-back-home" onclick="returnToHome()">🏠 返回首頁</button>
        </div>
        <div id="round-indicator" class="round-indicator">目前場數: 1 / ?</div>
        <h2 id="round-title">瑞士輪 - 第 1 場</h2>
        
        <div class="timer-container">
            <div id="timer-display" class="timer-display">00:03</div>
            <div class="timer-controls">
                <button onclick="startTimer()">開始</button>
                <button onclick="pauseTimer()">暫停</button>
                <button onclick="resetTimer()">重置</button>
                <button id="btn-add-time" onclick="addTime()" disabled>加時 (5分)</button>
            </div>
        </div>

        <div id="swiss-bracket-container"></div>
        
        <div style="text-align: center; margin-top: 20px;">
            <button id="btn-end-match" disabled onclick="endSwissRound()">比賽結束 (結算成績)</button>
            <button id="btn-start-knockout" style="display: none;" onclick="startKnockoutPhase()">進入雙淘汰賽 (前4強)</button>
        </div>
    </div>

    <div id="screen-4" class="screen">
        <div class="top-nav-bar">
            <button class="btn-back-home" onclick="returnToHome()">🏠 返回首頁</button>
        </div>
        <div id="ko-round-indicator" class="round-indicator">雙淘汰場數: 1 / 4</div>
        <h2 id="knockout-title">四強雙淘汰賽 (一戰定生死)</h2>
        
        <div class="timer-container">
            <div id="timer-display-ko" class="timer-display">00:03</div>
            <div class="timer-controls">
                <button onclick="startTimer('ko')">開始</button>
                <button onclick="pauseTimer('ko')">暫停</button>
                <button onclick="resetTimer('ko')">重置</button>
                <button id="btn-add-time-ko" onclick="addTime('ko')" disabled>加時 (5分)</button>
            </div>
        </div>

        <div id="knockout-tree-container"></div>
        
        <div style="text-align: center; margin-top: 20px;">
            <button id="btn-next-ko-match" disabled onclick="nextKnockoutRound()">下一場 (確認結果)</button>
        </div>
    </div>

    <script>
        // === 全域變數 ===
        const STORAGE_KEY = 'swiss_tournament_history_v1';
        let currentTournamentId = null;
        let currentScreenId = 'screen-1';
        let renamingRecordId = null;
        let deletingRecordId = null;

        let players = [];
        let currentRound = 1;
        let totalSwissRounds = 0;
        
        // 雙淘汰變數
        let knockoutPlayers = [];
        let deMatches = {};
        let deCurrentRound = 1;
        let gfFormat = 'bo1'; // 'bo1' (預設) 或 'bo3'
        let finalRankings = []; // [0:冠軍, 1:亞軍, 2:季軍]
        
        let timerInterval = null;
        let timeLeft = 3; 
        let isRunning = false;
        let activeTimerMode = 'swiss'; 

        // === 歷史紀錄與 LocalStorage 管理 ===
        function loadHistoryList() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.error('讀取歷史紀錄失敗:', e);
                return [];
            }
        }

        function saveHistoryList(list) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            } catch (e) {
                console.error('儲存歷史紀錄失敗:', e);
            }
        }

        function formatTimestamp(ts) {
            const d = new Date(ts);
            const pad = n => n.toString().padStart(2, '0');
            return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function getCurrentSwissSelections() {
            const selections = {};
            const selects = document.querySelectorAll('#swiss-bracket-container .p1-select, #swiss-bracket-container .p2-select');
            selects.forEach(s => {
                const pid = s.getAttribute('data-id');
                if (pid) selections[pid] = s.value;
            });
            return selections;
        }

        function getCurrentKoSelections() {
            const selections = {};
            const selects = document.querySelectorAll('#knockout-tree-container .ko-select');
            selects.forEach(s => {
                const mId = s.getAttribute('data-match');
                const side = s.getAttribute('data-side');
                if (mId && side) selections[`${mId}_${side}`] = s.value;
            });
            return selections;
        }

        function getDraftNamesFromInputs(count) {
            const names = [];
            for (let i = 1; i <= count; i++) {
                const el = document.getElementById(`pname-${i}`);
                names.push(el ? el.value : '');
            }
            return names;
        }

        function getDraftDecksFromInputs(count) {
            const decks = [];
            for (let i = 1; i <= count; i++) {
                const el = document.getElementById(`pdeck-${i}`);
                decks.push(el ? el.value : '');
            }
            return decks;
        }

        function createNewTournamentRecord(playerCount) {
            const list = loadHistoryList();
            const now = Date.now();
            const id = 'tour-' + now + '-' + Math.random().toString(36).slice(2, 6);
            const defaultTitle = `賽事 ${formatTimestamp(now)}`;
            const newRecord = {
                id: id,
                title: defaultTitle,
                createdAt: now,
                updatedAt: now,
                currentScreen: 'screen-2',
                playerCount: playerCount,
                draftNames: Array(playerCount).fill(''),
                draftDecks: Array(playerCount).fill(''),
                players: [],
                currentRound: 1,
                totalSwissRounds: totalSwissRounds,
                swissSelections: {},
                knockoutPlayers: [],
                deMatches: {},
                deCurrentRound: 1,
                gfFormat: 'bo1',
                koSelections: {},
                finalRankings: [],
                timeLeft: 3,
                activeTimerMode: 'swiss'
            };
            list.unshift(newRecord);
            saveHistoryList(list);
            currentTournamentId = id;
            renderHistorySidebar();
            return id;
        }

        function saveCurrentTournamentState() {
            if (!currentTournamentId) return;
            const list = loadHistoryList();
            const idx = list.findIndex(item => item.id === currentTournamentId);
            if (idx === -1) return;

            const rec = list[idx];
            rec.updatedAt = Date.now();
            rec.currentScreen = currentScreenId;
            rec.players = JSON.parse(JSON.stringify(players));
            rec.currentRound = currentRound;
            rec.totalSwissRounds = totalSwissRounds;
            rec.knockoutPlayers = JSON.parse(JSON.stringify(knockoutPlayers));
            rec.deMatches = JSON.parse(JSON.stringify(deMatches));
            rec.deCurrentRound = deCurrentRound;
            rec.gfFormat = gfFormat;
            rec.finalRankings = JSON.parse(JSON.stringify(finalRankings));
            rec.timeLeft = timeLeft;
            rec.activeTimerMode = activeTimerMode;

            if (currentScreenId === 'screen-2') {
                rec.draftNames = getDraftNamesFromInputs(rec.playerCount);
                rec.draftDecks = getDraftDecksFromInputs(rec.playerCount);
            } else if (currentScreenId === 'screen-3') {
                rec.swissSelections = getCurrentSwissSelections();
            } else if (currentScreenId === 'screen-4') {
                rec.koSelections = getCurrentKoSelections();
            }

            saveHistoryList(list);
            renderHistorySidebar();
        }

        function getRecordStatusText(rec) {
            const pCount = rec.playerCount || (rec.players ? rec.players.length : 0);
            if (rec.currentScreen === 'screen-2') {
                return `📝 名單輸入中 (${pCount}人)`;
            }
            if (rec.currentScreen === 'screen-3') {
                if (rec.currentRound > rec.totalSwissRounds) {
                    return `✅ 瑞士輪結束・待進四強 (${pCount}人)`;
                }
                return `⚔️ 瑞士輪 第 ${rec.currentRound} / ${rec.totalSwissRounds} 場 (${pCount}人)`;
            }
            if (rec.currentScreen === 'screen-4') {
                if (rec.deCurrentRound === 99 && rec.finalRankings && rec.finalRankings[0]) {
                    const champ = rec.finalRankings[0];
                    const champName = (champ.isBye || champ.isVacant) ? '從缺' : champ.name;
                    return `🏆 已完賽 (冠軍: ${champName})`;
                }
                return `🔥 雙淘汰賽 第 ${rec.deCurrentRound} / 4 場 (${pCount}人)`;
            }
            return `進行中 (${pCount}人)`;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getDeckBadgeHTML(deck) {
            if (!deck || !String(deck).trim()) return '';
            return `<span class="deck-badge">${escapeHtml(String(deck).trim())}</span>`;
        }

        function formatRankingPlayerHTML(p) {
            if (!p || p.isBye || p.isVacant || p.name === '從缺') return '從缺';
            return `${escapeHtml(p.name)}${getDeckBadgeHTML(p.deck)}`;
        }

        function toggleHistorySidebar(forceState) {
            const sidebar = document.getElementById('history-sidebar');
            if (typeof forceState === 'boolean') {
                sidebar.classList.toggle('collapsed', !forceState);
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        function renderHistorySidebar() {
            const container = document.getElementById('history-list');
            const list = loadHistoryList();

            if (list.length === 0) {
                container.innerHTML = `<div class="history-empty">尚無賽事紀錄。<br>輸入人數開始新比賽後，<br>系統將自動於此處保存進度！</div>`;
                return;
            }

            let html = '';
            list.forEach(rec => {
                const isActive = rec.id === currentTournamentId && currentScreenId !== 'screen-1';
                const statusText = getRecordStatusText(rec);
                const updatedStr = formatTimestamp(rec.updatedAt || rec.createdAt);

                html += `<div class="history-item ${isActive ? 'current-active' : ''}">`;

                if (renamingRecordId === rec.id) {
                    html += `
                        <div class="rename-box">
                            <input type="text" id="rename-input-${rec.id}" value="${escapeHtml(rec.title)}"
                                onkeydown="if(event.key==='Enter') confirmRenameRecord('${rec.id}'); else if(event.key==='Escape') cancelRenameRecord();">
                            <div class="rename-box-btns">
                                <button class="history-btn resume-btn" onclick="confirmRenameRecord('${rec.id}')">儲存</button>
                                <button class="history-btn rename-btn" onclick="cancelRenameRecord()">取消</button>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="history-item-title" onclick="resumeTournament('${rec.id}')" title="點擊接續此場比賽">
                            ${escapeHtml(rec.title)}
                        </div>
                    `;
                }

                html += `
                    <div class="history-item-meta">${escapeHtml(statusText)}</div>
                    <div class="history-item-time">最後更新: ${updatedStr}</div>
                `;

                if (deletingRecordId === rec.id) {
                    html += `
                        <div class="history-item-actions">
                            <button class="history-btn delete-btn" onclick="confirmDeleteRecord('${rec.id}')">確定刪除</button>
                            <button class="history-btn rename-btn" onclick="cancelDeleteRecord()">取消</button>
                        </div>
                    `;
                } else if (renamingRecordId !== rec.id) {
                    html += `
                        <div class="history-item-actions">
                            <button class="history-btn resume-btn" onclick="resumeTournament('${rec.id}')">${isActive ? '進行中' : '接續賽程'}</button>
                            <button class="history-btn rename-btn" onclick="startRenameRecord('${rec.id}')">重新命名</button>
                            <button class="history-btn delete-btn" onclick="startDeleteRecord('${rec.id}')">刪除</button>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            container.innerHTML = html;

            if (renamingRecordId) {
                const inputEl = document.getElementById(`rename-input-${renamingRecordId}`);
                if (inputEl) {
                    inputEl.focus();
                    inputEl.select();
                }
            }
        }

        function startRenameRecord(id) {
            deletingRecordId = null;
            renamingRecordId = id;
            renderHistorySidebar();
        }

        function cancelRenameRecord() {
            renamingRecordId = null;
            renderHistorySidebar();
        }

        function confirmRenameRecord(id) {
            const inputEl = document.getElementById(`rename-input-${id}`);
            if (!inputEl) return;
            const newTitle = inputEl.value.trim();
            if (!newTitle) {
                alert('名稱不能為空！');
                return;
            }
            const list = loadHistoryList();
            const rec = list.find(item => item.id === id);
            if (rec) {
                rec.title = newTitle;
                rec.updatedAt = Date.now();
                saveHistoryList(list);
            }
            renamingRecordId = null;
            renderHistorySidebar();
        }

        function startDeleteRecord(id) {
            renamingRecordId = null;
            deletingRecordId = id;
            renderHistorySidebar();
        }

        function cancelDeleteRecord() {
            deletingRecordId = null;
            renderHistorySidebar();
        }

        function confirmDeleteRecord(id) {
            let list = loadHistoryList();
            list = list.filter(item => item.id !== id);
            saveHistoryList(list);
            deletingRecordId = null;

            if (currentTournamentId === id) {
                pauseTimer();
                currentTournamentId = null;
                goToScreen('screen-1');
            }
            renderHistorySidebar();
        }

        function resumeTournament(id) {
            const list = loadHistoryList();
            const rec = list.find(item => item.id === id);
            if (!rec) return;

            pauseTimer();
            currentTournamentId = rec.id;
            players = JSON.parse(JSON.stringify(rec.players || []));
            currentRound = rec.currentRound || 1;
            totalSwissRounds = rec.totalSwissRounds || Math.ceil(Math.log2(rec.playerCount || 2));
            knockoutPlayers = JSON.parse(JSON.stringify(rec.knockoutPlayers || []));
            deMatches = JSON.parse(JSON.stringify(rec.deMatches || {}));
            deCurrentRound = rec.deCurrentRound || 1;
            gfFormat = rec.gfFormat || 'bo1';
            finalRankings = JSON.parse(JSON.stringify(rec.finalRankings || []));
            timeLeft = typeof rec.timeLeft === 'number' ? rec.timeLeft : 3;
            activeTimerMode = rec.activeTimerMode || 'swiss';

            document.getElementById('player-count').value = rec.playerCount || (players.length || '');

            if (rec.currentScreen === 'screen-2') {
                activeTimerMode = 'swiss';
                buildNameInputsDOM(rec.playerCount, rec.draftNames || [], rec.draftDecks || []);
                goToScreen('screen-2');
            } else if (rec.currentScreen === 'screen-3') {
                activeTimerMode = 'swiss';
                if (currentRound > totalSwissRounds) {
                    renderSwissCompletedView();
                } else {
                    renderSwissRound(true);
                    // 還原尚未結算的下拉選單選項
                    if (rec.swissSelections) {
                        const selects = document.querySelectorAll('#swiss-bracket-container .p1-select, #swiss-bracket-container .p2-select');
                        selects.forEach(s => {
                            const pid = s.getAttribute('data-id');
                            if (pid && rec.swissSelections[pid] !== undefined) {
                                s.value = rec.swissSelections[pid];
                            }
                        });
                        checkSwissMatchesDone();
                    }
                }
                updateDisplay('swiss');
                goToScreen('screen-3');
            } else if (rec.currentScreen === 'screen-4') {
                activeTimerMode = 'ko';
                renderKnockoutTree();
                if (deCurrentRound < 99 && rec.koSelections) {
                    const selects = document.querySelectorAll('#knockout-tree-container .ko-select');
                    selects.forEach(s => {
                        const key = `${s.getAttribute('data-match')}_${s.getAttribute('data-side')}`;
                        if (rec.koSelections[key] !== undefined) {
                            s.value = rec.koSelections[key];
                        }
                    });
                    checkKoMatchesDone();
                }
                updateDisplay('ko');
                goToScreen('screen-4');
            }

            renderHistorySidebar();
        }

        function returnToHome() {
            saveCurrentTournamentState();
            pauseTimer();
            goToScreen('screen-1');
            toggleHistorySidebar(true);
            renderHistorySidebar();
        }

        // === 畫面切換 ===
        function goToScreen(showId) {
            currentScreenId = showId;
            document.querySelectorAll('.screen').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById(showId).classList.add('active');
        }

        function switchScreen(hideId, showId) {
            currentScreenId = showId;
            document.getElementById(hideId).classList.remove('active');
            setTimeout(() => {
                document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
                document.getElementById(showId).classList.add('active');
                saveCurrentTournamentState();
            }, 400);
        }
        function handleEnter(e, btnId) { if (e.key === 'Enter') document.getElementById(btnId).click(); }

        // === 初始化 ===
        function buildNameInputsDOM(count, existingNames = [], existingDecks = []) {
            const container = document.getElementById('name-inputs-container');
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const nameVal = existingNames[i - 1] !== undefined ? escapeHtml(existingNames[i - 1]) : '';
                const deckVal = existingDecks[i - 1] !== undefined ? escapeHtml(existingDecks[i - 1]) : '';
                container.innerHTML += `
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <span style="min-width: 24px;">${i}.</span>
                        <input type="text" id="pname-${i}" value="${nameVal}" placeholder="輸入第 ${i} 位選手名稱"
                            style="flex: 1;"
                            oninput="saveCurrentTournamentState()"
                            onkeypress="if(event.key==='Enter') document.getElementById('pdeck-${i}').focus();">
                        <input type="text" id="pdeck-${i}" value="${deckVal}" placeholder="輸入牌組名稱"
                            style="flex: 1;"
                            oninput="saveCurrentTournamentState()"
                            onkeypress="if(event.key==='Enter'&&${i===count}) document.getElementById('btn-screen-2').click(); else if(event.key==='Enter') document.getElementById('pname-${i+1}').focus();">
                    </div>
                `;
            }
        }

        function generateNameInputs() {
            const count = parseInt(document.getElementById('player-count').value);
            if (isNaN(count) || count < 2) { alert("請輸入有效的大於1的人數！"); return; }
            
            pauseTimer();
            players = [];
            currentRound = 1;
            totalSwissRounds = Math.ceil(Math.log2(count));
            knockoutPlayers = [];
            deMatches = {};
            deCurrentRound = 1;
            gfFormat = 'bo1';
            finalRankings = [];
            timeLeft = 3;
            activeTimerMode = 'swiss';

            buildNameInputsDOM(count);
            createNewTournamentRecord(count);
            switchScreen('screen-1', 'screen-2');
            setTimeout(() => {
                const firstInput = document.getElementById('pname-1');
                if (firstInput) firstInput.focus();
            }, 450);
        }

        function startSwissTournament() {
            const count = parseInt(document.getElementById('player-count').value);
            players = [];
            for (let i = 1; i <= count; i++) {
                const name = document.getElementById(`pname-${i}`).value.trim() || `選手 ${i}`;
                const deckEl = document.getElementById(`pdeck-${i}`);
                const deck = deckEl ? deckEl.value.trim() : '';
                players.push({ id: i, name: name, deck: deck, score: 0 });
            }
            currentRound = 1;
            activeTimerMode = 'swiss';
            renderSwissRound();
            switchScreen('screen-2', 'screen-3');
        }

        // === 瑞士輪邏輯 ===
        function renderSwissCompletedView() {
            document.getElementById('round-indicator').innerText = `瑞士輪已結束`;
            document.getElementById('round-title').innerText = `瑞士輪 - 第 ${totalSwissRounds} 場`;
            document.getElementById('swiss-bracket-container').innerHTML = `<h3 style="color:var(--success)">瑞士輪全部結束！分數已結算完成。</h3>`;
            document.getElementById('btn-end-match').style.display = 'none';
            document.getElementById('btn-start-knockout').style.display = 'inline-block';
        }

        function renderSwissRound(skipTimerReset = false) {
            document.getElementById('round-indicator').innerText = `目前場數: ${currentRound} / ${totalSwissRounds}`;
            document.getElementById('round-title').innerText = `瑞士輪 - 第 ${currentRound} 場`;
            document.getElementById('btn-end-match').style.display = 'inline-block';
            document.getElementById('btn-start-knockout').style.display = 'none';

            if (!skipTimerReset) {
                resetTimer('swiss');
            }
            
            players.sort((a, b) => b.score - a.score);
            const container = document.getElementById('swiss-bracket-container');
            container.innerHTML = '';
            
            for (let i = 0; i < players.length; i += 2) {
                if (i + 1 < players.length) {
                    let p1 = players[i];
                    let p2 = players[i+1];
                    container.innerHTML += `
                        <div class="match-row">
                            <div class="player-box">
                                <span>${escapeHtml(p1.name)}${getDeckBadgeHTML(p1.deck)} (${p1.score}分)</span>
                                <select class="result-select p1-select" data-id="${p1.id}" onchange="syncSwissSelect(this, 'left'); checkSwissMatchesDone(); saveCurrentTournamentState();">
                                    <option value="" selected disabled>-</option><option value="win">贏</option><option value="loss">輸</option><option value="draw">平局</option>
                                </select>
                            </div>
                            <div class="vs">VS</div>
                            <div class="player-box right">
                                <select class="result-select p2-select" data-id="${p2.id}" onchange="syncSwissSelect(this, 'right'); checkSwissMatchesDone(); saveCurrentTournamentState();">
                                    <option value="" selected disabled>-</option><option value="win">贏</option><option value="loss">輸</option><option value="draw">平局</option>
                                </select>
                                <span>${escapeHtml(p2.name)}${getDeckBadgeHTML(p2.deck)} (${p2.score}分)</span>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML += `
                        <div class="match-row" style="border-color: var(--disabled);">
                            <span>${escapeHtml(players[i].name)}${getDeckBadgeHTML(players[i].deck)} (${players[i].score}分) - 本輪輪空 (自動得3分)</span>
                            <input type="hidden" class="result-select bye" data-id="${players[i].id}" value="win">
                        </div>
                    `;
                }
            }
            document.getElementById('btn-end-match').disabled = true;
        }

        function syncSwissSelect(element, side) {
            const row = element.closest('.match-row');
            const leftSelect = row.querySelector('.p1-select');
            const rightSelect = row.querySelector('.p2-select');
            if (!leftSelect || !rightSelect) return;
            const oppSelect = side === 'left' ? rightSelect : leftSelect;

            if (element.value === 'win') {
                // 若選「贏」則對面自動選「輸」
                oppSelect.value = 'loss';
            } else if (element.value === 'draw') {
                oppSelect.value = 'draw';
            } else if (element.value === 'loss') {
                // 某側選擇「輸」時，不強制對面變為「贏」，讓對面也可以選「輸」(雙敗) 或「贏」
                // 若對面原本是「平局」，則重置對面選項避免單方平局
                if (oppSelect.value === 'draw') {
                    oppSelect.value = '';
                }
            }
        }

        function checkSwissMatchesDone() {
            const selects = document.querySelectorAll('#swiss-bracket-container .result-select');
            let allDone = true;
            selects.forEach(s => { if (s.value === "") allDone = false; });
            document.getElementById('btn-end-match').disabled = !allDone;
        }

        function endSwissRound() {
            const container = document.getElementById('swiss-bracket-container');
            const allSelects = container.querySelectorAll('.p1-select, .p2-select');
            const byes = container.querySelectorAll('input.bye');

            allSelects.forEach(sel => {
                let p = players.find(x => x.id == sel.getAttribute('data-id'));
                if (p) {
                    if (sel.value === 'win') p.score += 3;
                    else if (sel.value === 'draw') p.score += 1;
                }
            });
            byes.forEach(sel => {
                let p = players.find(x => x.id == sel.getAttribute('data-id'));
                if (p) p.score += 3;
            });

            currentRound++;
            if (currentRound > totalSwissRounds) {
                renderSwissCompletedView();
            } else {
                renderSwissRound();
            }
            saveCurrentTournamentState();
        }

        // === 畫面 3 -> 畫面 4 (前四強 雙淘汰 - 一戰定生死 / 冠亞可切換BO3) ===
        function startKnockoutPhase() {
            activeTimerMode = 'ko';
            gfFormat = 'bo1';
            players.sort((a, b) => b.score - a.score);
            
            let topCount = Math.min(4, players.length);
            knockoutPlayers = players.slice(0, topCount);
            
            while(knockoutPlayers.length < 4) {
                knockoutPlayers.push({ id: 'bye-' + knockoutPlayers.length, name: '輪空 (Bye)', score: 0, isBye: true });
            }

            // 初始化雙淘汰結構 (移除 gf2)
            deMatches = {
                w1: { id: 'w1', title: '勝部首輪 (Seed 1 v 4)', p1: knockoutPlayers[0], p2: knockoutPlayers[3], winner: null, loser: null },
                w2: { id: 'w2', title: '勝部首輪 (Seed 2 v 3)', p1: knockoutPlayers[1], p2: knockoutPlayers[2], winner: null, loser: null },
                w3: { id: 'w3', title: '勝部決賽', p1: null, p2: null, winner: null, loser: null },
                l1: { id: 'l1', title: '敗部首輪', p1: null, p2: null, winner: null, loser: null },
                l2: { id: 'l2', title: '敗部決賽 (爭奪季軍)', p1: null, p2: null, winner: null, loser: null },
                gf1: { id: 'gf1', title: '總決賽 (BO1 一戰定生死)', p1: null, p2: null, winner: null, loser: null }
            };

            deCurrentRound = 1;
            seedRoundMatches();
            renderKnockoutTree();
            resetTimer('ko');
            switchScreen('screen-3', 'screen-4');
        }

        function setGrandFinalsFormat(format) {
            if (deCurrentRound === 99 || gfFormat === format) return;
            gfFormat = format;
            if (deMatches && deMatches.gf1) {
                deMatches.gf1.title = gfFormat === 'bo3' ? '總決賽 (BO3 三戰兩勝)' : '總決賽 (BO1 一戰定生死)';
            }
            renderKnockoutTree();
            saveCurrentTournamentState();
        }

        function getMatchesForRound(round) {
            if (round === 1) return ['w1', 'w2'];
            if (round === 2) return ['w3', 'l1'];
            if (round === 3) return ['l2'];
            if (round === 4) return ['gf1'];
            return []; // 移除第五輪
        }

        function seedRoundMatches() {
            let activeKeys = getMatchesForRound(deCurrentRound);
            activeKeys.forEach(mk => {
                let m = deMatches[mk];
                if (m.p1 && m.p2 && m.winner === null) {
                    if (m.p1.isBye && m.p2.isBye) {
                        m.isDoubleLoss = true;
                        m.winner = { id: 'bye-win-' + m.id, name: '輪空 (Bye)', score: 0, isBye: true, isVacant: true };
                        m.loser = { id: 'bye-loss-' + m.id, name: '輪空 (Bye)', score: 0, isBye: true, isVacant: true };
                    }
                    else if (m.p1.isBye) { m.winner = m.p2; m.loser = m.p1; }
                    else if (m.p2.isBye) { m.winner = m.p1; m.loser = m.p2; }
                }
            });
        }

        // 生成卡片內的選手 HTML
        function getPlayerRowHTML(match, playerKey, isCurrentRound) {
            let p = match[playerKey];
            if (!p) return `<div class="ko-row-player"><span class="ko-name" style="color:#555">待定 (TBD)</span></div>`;

            const isBo3Gf = match.id === 'gf1' && gfFormat === 'bo3';
            let resultSelect = '';
            if (p.isBye) {
                resultSelect = `<span style="color:var(--disabled); font-size: 0.9rem;">- (輪空)</span>`;
            } else if (isCurrentRound && match.winner === null) {
                if (isBo3Gf) {
                    resultSelect = `
                        <select class="ko-select ko-bo3-select" data-match="${match.id}" data-side="${playerKey}" onchange="syncKoSelect(this); checkKoMatchesDone(); saveCurrentTournamentState();">
                            <option value="0" selected>0 勝</option>
                            <option value="1">1 勝</option>
                            <option value="2">2 勝</option>
                            <option value="loss">敗(雙敗)</option>
                        </select>
                    `;
                } else {
                    resultSelect = `
                        <select class="ko-select" data-match="${match.id}" data-side="${playerKey}" onchange="syncKoSelect(this); checkKoMatchesDone(); saveCurrentTournamentState();">
                            <option value="" disabled selected>-</option>
                            <option value="win">贏</option><option value="loss">輸</option><option value="draw">平</option>
                        </select>
                    `;
                }
            } else if (match.winner) {
                const winsCount = match[playerKey + 'Wins'];
                const winsPrefix = (isBo3Gf && typeof winsCount === 'number') ? `${winsCount}勝・` : '';
                if (!match.isDoubleLoss && match.winner.id === p.id) {
                    resultSelect = `<span style="color:var(--success); font-size: 0.9rem; font-weight: bold;">${winsPrefix}勝</span>`;
                } else {
                    resultSelect = `<span style="color:var(--danger); font-size: 0.9rem;">${winsPrefix}敗</span>`;
                }
            }

            const isLoser = match.isDoubleLoss || (match.winner && match.winner.id !== p.id);

            return `
                <div class="ko-row-player ${isLoser ? 'loser' : ''}">
                    <div class="ko-player-info">
                        <span class="ko-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</span>
                        ${getDeckBadgeHTML(p.deck)}
                    </div>
                    ${resultSelect}
                </div>
            `;
        }

        // 生成整張比賽卡片 HTML
        function getKoCard(matchKey) {
            let m = deMatches[matchKey];
            if (!m) return '';
            if (matchKey === 'gf1') {
                m.title = gfFormat === 'bo3' ? '總決賽 (BO3 三戰兩勝)' : '總決賽 (BO1 一戰定生死)';
            }
            let isCurrentRound = getMatchesForRound(deCurrentRound).includes(matchKey);
            let activeClass = isCurrentRound && m.winner === null ? 'active-match' : '';

            return `
                <div class="ko-card ${activeClass}" id="${m.id}">
                    <div class="match-title">${m.title}</div>
                    ${getPlayerRowHTML(m, 'p1', isCurrentRound)}
                    ${getPlayerRowHTML(m, 'p2', isCurrentRound)}
                </div>
            `;
        }

        // 渲染直式樹狀圖 (分三區塊)
        function renderKnockoutTree() {
            if (deCurrentRound < 99) {
                document.getElementById('ko-round-indicator').innerText = `雙淘汰場數: ${deCurrentRound} / 4`;
                document.getElementById('btn-next-ko-match').style.display = 'inline-block';
            } else {
                document.getElementById('ko-round-indicator').innerText = `比賽完全結束`;
                document.getElementById('btn-next-ko-match').style.display = 'none';
            }

            const container = document.getElementById('knockout-tree-container');
            
            let html = `<div class="de-bracket-container">`;

            // 【第一區：勝部賽程樹狀圖】
            html += `
            <div class="bracket-section" style="border-color: var(--accent-color);">
                <h3 style="color: var(--accent-color);">🟦 勝部賽程 (Winners Bracket)</h3>
                <div class="vertical-tree">
                    <div class="tree-row">${getKoCard('w3')}</div>
                    <div class="fork-stem"></div>
                    <div class="fork-branches"></div>
                    <div class="tree-row" style="gap: 40px;">
                        ${getKoCard('w1')}
                        ${getKoCard('w2')}
                    </div>
                </div>
            </div>`;

            // 【第二區：敗部賽程樹狀圖】
            html += `
            <div class="bracket-section" style="border-color: var(--danger);">
                <h3 style="color: var(--danger);">🟥 敗部賽程 (Losers Bracket)</h3>
                <div class="vertical-tree">
                    <div class="tree-row">${getKoCard('l2')}</div>
                    <div class="fork-stem"></div>
                    <div class="fork-branches"></div>
                    <div class="tree-row" style="gap: 40px;">
                        <div class="ko-card dummy">勝部決賽敗者<br>(等待降級)</div>
                        ${getKoCard('l1')}
                    </div>
                </div>
            </div>`;

            // 【第三區：總決賽 (支援切換 BO1 / BO3)】
            html += `
            <div class="bracket-section" style="border-color: var(--gold);">
                <h3 style="color: var(--gold);">🟨 總決賽 (Grand Finals)</h3>
                <div class="gf-mode-switcher">
                    <span class="gf-mode-label">冠亞賽制：</span>
                    <button type="button" class="gf-mode-btn ${gfFormat === 'bo1' ? 'active' : ''}"
                        ${deCurrentRound === 99 ? 'disabled' : ''}
                        onclick="setGrandFinalsFormat('bo1')">BO1 (單場決勝)</button>
                    <button type="button" class="gf-mode-btn ${gfFormat === 'bo3' ? 'active' : ''}"
                        ${deCurrentRound === 99 ? 'disabled' : ''}
                        onclick="setGrandFinalsFormat('bo3')">BO3 (三戰兩勝)</button>
                </div>
                <div class="vertical-tree">
                    <div class="tree-row">${getKoCard('gf1')}</div>
                </div>
            </div>`;

            html += `</div>`; // End de-bracket-container

            // 若比賽結束，在下方呈現冠亞季軍排行榜
            if (deCurrentRound === 99) {
                html += `
                <div class="rankings-box">
                    <h2 style="color: var(--success); font-size: 2.5rem; margin-top:0;">🏆 最終賽事成績 🏆</h2>
                    <div class="rank-item rank-1">🥇 冠軍: ${formatRankingPlayerHTML(finalRankings[0])}</div>
                    <div class="rank-item rank-2">🥈 亞軍: ${formatRankingPlayerHTML(finalRankings[1])}</div>
                    <div class="rank-item rank-3">🥉 季軍: ${formatRankingPlayerHTML(finalRankings[2])}</div>
                </div>
                `;
            }

            container.innerHTML = html;
            checkKoMatchesDone(); 
        }

        function syncKoSelect(element) {
            const card = element.closest('.ko-card');
            const matchId = element.getAttribute('data-match');
            const side = element.getAttribute('data-side');
            const oppSide = side === 'p1' ? 'p2' : 'p1';
            const oppSelect = card.querySelector(`.ko-select[data-side="${oppSide}"]`);
            if (!oppSelect) return;

            if (matchId === 'gf1' && gfFormat === 'bo3') {
                // BO3 模式：先達 2 勝者為冠軍，不可雙方同時 2 勝
                if (element.value === '2') {
                    if (oppSelect.value === '2') oppSelect.value = '1';
                    else if (oppSelect.value === 'loss') oppSelect.value = '0';
                } else if (element.value === '0' || element.value === '1') {
                    if (oppSelect.value === 'loss') oppSelect.value = '0';
                }
                return;
            }

            if (element.value === 'win') {
                oppSelect.value = 'loss';
            } else if (element.value === 'draw') {
                oppSelect.value = 'draw';
            } else if (element.value === 'loss') {
                // 某側選擇「輸」時，不強制對面變為「贏」，讓對面也可以選「輸」(雙敗) 或「贏」
                if (oppSelect.value === 'draw') {
                    oppSelect.value = '';
                }
            }
        }

        function checkKoMatchesDone() {
            if (deCurrentRound === 99) return;
            let activeKeys = getMatchesForRound(deCurrentRound);
            let allDone = true;
            
            activeKeys.forEach(mk => {
                let m = deMatches[mk];
                if (m.winner !== null) return; 
                const card = document.getElementById(m.id);
                if(card) {
                    const selects = card.querySelectorAll('select');
                    if (mk === 'gf1' && gfFormat === 'bo3') {
                        const p1Sel = card.querySelector('.ko-select[data-side="p1"]');
                        const p2Sel = card.querySelector('.ko-select[data-side="p2"]');
                        if (p1Sel && p2Sel) {
                            const v1 = p1Sel.value;
                            const v2 = p2Sel.value;
                            const hasTwoWinWinner = (v1 === '2' && (v2 === '0' || v2 === '1')) || (v2 === '2' && (v1 === '0' || v1 === '1'));
                            const isDoubleLoss = v1 === 'loss' && v2 === 'loss';
                            if (!hasTwoWinWinner && !isDoubleLoss) {
                                allDone = false;
                            }
                        }
                    } else if(selects.length > 0) {
                        selects.forEach(s => { if(s.value === '') allDone = false; });
                    }
                }
            });
            document.getElementById('btn-next-ko-match').disabled = !allDone;
        }

        // 確認結果，推進樹狀圖到下一場
        function nextKnockoutRound() {
            let activeKeys = getMatchesForRound(deCurrentRound);
            let hasDraw = false;
            
            // 1. 偵測平局 (強制重賽機制)
            activeKeys.forEach(mk => {
                let m = deMatches[mk];
                if (m.winner !== null) return; 
                const card = document.getElementById(m.id);
                if(card) {
                    const p1Select = card.querySelector('.ko-select[data-side="p1"]');
                    const p2Select = card.querySelector('.ko-select[data-side="p2"]');
                    if ((p1Select && p1Select.value === 'draw') || (p2Select && p2Select.value === 'draw')) {
                        hasDraw = true;
                    }
                }
            });

            if (hasDraw) {
                alert("⚠️ 發現平局！淘汰賽階段不允許平局。\n\n請雙方針對平局的賽事「再加賽一場」以分出勝負！系統已自動為您重置平局的選項。");
                activeKeys.forEach(mk => {
                    let m = deMatches[mk];
                    const card = document.getElementById(m.id);
                    if(card) {
                        const selects = card.querySelectorAll('.ko-select');
                        let matchHasDraw = false;
                        selects.forEach(s => { if (s.value === 'draw') matchHasDraw = true; });
                        if (matchHasDraw) {
                            selects.forEach(s => s.value = ''); 
                        }
                    }
                });
                checkKoMatchesDone();
                saveCurrentTournamentState();
                return; // 終止推進
            }

            // 2. 寫入勝負結果 (含雙敗判定與總決賽 BO3 勝場數判定)
            activeKeys.forEach(mk => {
                let m = deMatches[mk];
                if (m.winner !== null) return; 
                const card = document.getElementById(m.id);
                if(card) {
                    const p1Select = card.querySelector('.ko-select[data-side="p1"]');
                    const p2Select = card.querySelector('.ko-select[data-side="p2"]');
                    if (p1Select && p2Select) {
                        if (mk === 'gf1' && gfFormat === 'bo3') {
                            if (p1Select.value === '2') {
                                m.winner = m.p1;
                                m.loser = m.p2;
                                m.p1Wins = 2;
                                m.p2Wins = parseInt(p2Select.value, 10) || 0;
                            } else if (p2Select.value === '2') {
                                m.winner = m.p2;
                                m.loser = m.p1;
                                m.p2Wins = 2;
                                m.p1Wins = parseInt(p1Select.value, 10) || 0;
                            } else if (p1Select.value === 'loss' && p2Select.value === 'loss') {
                                m.isDoubleLoss = true;
                                m.winner = { id: 'bye-dl-win-' + m.id, name: '輪空 (Bye)', score: 0, isBye: true, isVacant: true };
                                m.loser = { id: 'bye-dl-loss-' + m.id, name: '輪空 (Bye)', score: 0, isBye: true, isVacant: true };
                            }
                        } else {
                            if (p1Select.value === 'win') {
                                m.winner = m.p1;
                                m.loser = m.p2;
                            } else if (p2Select.value === 'win') {
                                m.winner = m.p2;
                                m.loser = m.p1;
                            } else if (p1Select.value === 'loss' && p2Select.value === 'loss') {
                                // 雙敗：雙方皆判敗淘汰，下一輪對應位置以「輪空 (Bye)」遞補
                                m.isDoubleLoss = true;
                                m.winner = { id: 'bye-dl-win-' + m.id, name: '輪空 (Bye)', score: 0, isBye: true, isVacant: true };
                                m.loser = { id: 'bye-dl-loss-' + m.id, name: '輪空 (Bye)', score: 0, isBye: true, isVacant: true };
                            }
                        }
                    }
                }
            });

            // 3. 雙淘汰樹狀推進邏輯 (一戰定生死 / BO3 版)
            if (deCurrentRound === 1) {
                deMatches.w3.p1 = deMatches.w1.winner;
                deMatches.w3.p2 = deMatches.w2.winner;
                deMatches.l1.p1 = deMatches.w1.loser;
                deMatches.l1.p2 = deMatches.w2.loser;
                deCurrentRound = 2;
                resetTimer('ko');
            } else if (deCurrentRound === 2) {
                deMatches.gf1.p1 = deMatches.w3.winner;
                deMatches.l2.p1 = deMatches.w3.loser; // 勝部決賽敗者掉入敗部
                deMatches.l2.p2 = deMatches.l1.winner; // 敗部首輪勝者挺進
                deCurrentRound = 3;
                resetTimer('ko');
            } else if (deCurrentRound === 3) {
                deMatches.gf1.p2 = deMatches.l2.winner; // 敗部冠軍出爐
                finalRankings[2] = (deMatches.l2.isDoubleLoss || !deMatches.l2.loser || deMatches.l2.loser.isBye)
                    ? { name: '從缺', isVacant: true }
                    : deMatches.l2.loser;  // l2敗者確定為【季軍】(若雙敗則從缺)
                deCurrentRound = 4;
                resetTimer('ko');
            } else if (deCurrentRound === 4) {
                // 第四輪打完，直接結算冠亞軍，無視誰是勝部/敗部 (若雙敗或輪空則對應名次從缺)
                finalRankings[0] = (deMatches.gf1.isDoubleLoss || !deMatches.gf1.winner || deMatches.gf1.winner.isBye)
                    ? { name: '從缺', isVacant: true }
                    : deMatches.gf1.winner; // 冠軍
                finalRankings[1] = (deMatches.gf1.isDoubleLoss || !deMatches.gf1.loser || deMatches.gf1.loser.isBye)
                    ? { name: '從缺', isVacant: true }
                    : deMatches.gf1.loser;  // 亞軍
                deCurrentRound = 99; 
                pauseTimer('ko');
            }

            seedRoundMatches(); // 自動結算新一輪可能出現的輪空
            renderKnockoutTree();
            saveCurrentTournamentState();
        }

        // === 計時器邏輯 ===
        function updateDisplay(mode = activeTimerMode) {
            const displayId = mode === 'swiss' ? 'timer-display' : 'timer-display-ko';
            const btnId = mode === 'swiss' ? 'btn-add-time' : 'btn-add-time-ko';
            const display = document.getElementById(displayId);
            const addTimeBtn = document.getElementById(btnId);

            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            display.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

            if (timeLeft === 0) {
                display.classList.add('flash');
                addTimeBtn.disabled = false;
            } else {
                display.classList.remove('flash');
                addTimeBtn.disabled = true;
            }
        }

        function startTimer(mode = activeTimerMode) {
            if (isRunning || timeLeft === 0) return;
            isRunning = true;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay(mode);
                    saveCurrentTournamentState();
                }
                if (timeLeft === 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    updateDisplay(mode); 
                    saveCurrentTournamentState();
                }
            }, 1000);
        }

        function pauseTimer(mode = activeTimerMode) {
            clearInterval(timerInterval);
            isRunning = false;
        }

        function resetTimer(mode = activeTimerMode) {
            pauseTimer(mode);
            timeLeft = 5; 
            updateDisplay(mode);
            saveCurrentTournamentState();
        }

        function addTime(mode = activeTimerMode) {
            if (timeLeft !== 0) return; 
            pauseTimer(mode);
            timeLeft = 5 * 60; 
            updateDisplay(mode);
            saveCurrentTournamentState();
        }

        // 頁面載入時渲染左側歷史紀錄欄
        window.addEventListener('DOMContentLoaded', () => {
            renderHistorySidebar();
        });
    </script>
</body>
</html>
